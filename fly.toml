# Fly.io config for the PrepUp API. Run `fly launch --no-deploy --copy-config`
# once to create the app (it will ask to rename `app` if the name is taken).
app = "prepup-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies database migrations before a new version goes live.
  release_command = "node dist/migrate.js"

[env]
  AUTH_MODE = "supabase"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
